name: group_imprint
display_name: 群友印象
short_desc: 给小群维护长期群友印象档案，每天自动更新
desc: >-
  每天 04:30 读过去 24 小时的群消息，按人聚合成简短印象卡（标签 + 一句话），
  与旧卡合并更新；12:30 对当天发言超过 30 条的人补跑一次增量；
  新人第一次说话立刻建一张极简卡。每次 LLM 请求只注入「当前发言人」那一张，
  约 60~80 字。只为 20 人以内的小群设计，发言人数超限自动跳过。
help: /印象 查自己；/印象 昵称 查别人；/印象 更新 管理员手动重跑当天。
version: 1.0.0
author: local
astrbot_version: ">=4.0.0"
