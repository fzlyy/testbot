# Docker 版：AstrBot + NapCat 一起跑（Windows / macOS / Linux 通用）
#
# 用法：
#   1. 把本文件放空目录，执行 docker compose up -d
#   2. docker logs -f napcat          看扫码 / WebUI Token
#   3. docker logs -f astrbot         看 AstrBot 初始密码
#   4. 浏览器打开 http://127.0.0.1:6185 配 DeepSeek
#   5. NapCat WebUI http://127.0.0.1:6099 → 网络配置 → 新建 → WebSockets 客户端
#        URL 填：ws://astrbot:6199/ws        ← 容器名，不是 127.0.0.1
#        Token：留空（与 AstrBot 保持一致）
#   6. AstrBot 机器人 → 创建 → OneBot v11，端口 6199，主机 0.0.0.0
#
# 只有 WebUI 端口映射到本机回环地址；6199 不出容器网络，避免公网暴露。
# 想把 6199 也给宿主机（例如 NapCat 跑在别的机器），自行加 ports 并务必加防火墙白名单。

services:
  astrbot:
    image: soulter/astrbot:latest
    # 大陆网络拉不动镜像时，把上面一行换成：
    # image: m.daocloud.io/docker.io/soulter/astrbot:latest
    container_name: astrbot
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6185:6185"
    volumes:
      - ./data/astrbot:/AstrBot/data

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    depends_on:
      - astrbot
    environment:
      MODE: ws
      # 改成你自己的随机串，这是 NapCat WebUI 的登录令牌
      WEBUI_TOKEN: change-me-to-a-random-string
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/plugins:/app/napcat/plugins
